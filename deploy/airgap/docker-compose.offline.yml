# Offline install compose — uses pre-loaded images only (no build contexts).
# Generated into air-gap bundles by bundle.sh / bundle.ps1.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pysetu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pysetu-airgap}
      POSTGRES_DB: pysetu
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pysetu -d pysetu"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.17
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev -dev-root-token-id=${VAULT_TOKEN:-dev-root-token}
    restart: unless-stopped

  opa:
    image: openpolicyagent/opa:0.68.0
    command:
      - run
      - --server
      - --log-level=info
      - /policies
    volumes:
      - ./opa/policies:/policies:ro
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.5.4
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    image: ${PYSETU_BACKEND_IMAGE:-pysetu/backend:0.1.0}
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    environment:
      AIR_GAP_MODE: "true"
      DATABASE_URL: postgresql+asyncpg://pysetu:${POSTGRES_PASSWORD:-pysetu-airgap}@postgres:5432/pysetu
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-airgap-change-me-before-production}
      DEBUG: "false"
      CORS_ORIGINS: '["http://localhost:3000"]'
      FRONTEND_URL: http://localhost:3000
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      OLLAMA_ENABLED: "true"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-llama3.2}
      GATEWAY_MOCK_MODE: "false"
      VAULT_ENABLED: "false"
      OPA_ENABLED: "true"
      OPA_BASE_URL: http://opa:8181
      OPA_FAIL_OPEN: "false"
      OTEL_ENABLED: "true"
      OTEL_EXPORTER: console
      SMTP_ENABLED: "false"
      LLM_REBALANCE_SCHEDULE_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      opa:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped

  celery-worker:
    image: ${PYSETU_BACKEND_IMAGE:-pysetu/backend:0.1.0}
    command: celery -A app.worker.celery_app worker --loglevel=info
    environment:
      AIR_GAP_MODE: "true"
      DATABASE_URL: postgresql+asyncpg://pysetu:${POSTGRES_PASSWORD:-pysetu-airgap}@postgres:5432/pysetu
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-airgap-change-me-before-production}
      DEBUG: "false"
      SMTP_ENABLED: "false"
      OLLAMA_ENABLED: "true"
      OLLAMA_BASE_URL: http://ollama:11434
      OPA_ENABLED: "true"
      OPA_BASE_URL: http://opa:8181
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  celery-beat:
    image: ${PYSETU_BACKEND_IMAGE:-pysetu/backend:0.1.0}
    command: celery -A app.worker.celery_app beat --loglevel=info
    environment:
      AIR_GAP_MODE: "true"
      DATABASE_URL: postgresql+asyncpg://pysetu:${POSTGRES_PASSWORD:-pysetu-airgap}@postgres:5432/pysetu
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-airgap-change-me-before-production}
      DEBUG: "false"
      LLM_REBALANCE_SCHEDULE_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      celery-worker:
        condition: service_started
    restart: unless-stopped

  frontend:
    image: ${PYSETU_FRONTEND_IMAGE:-pysetu/frontend:0.1.0}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001/api/v1}
      INTERNAL_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
