apiVersion: v1
kind: Service
metadata:
  name: {{ include "helixguard.fullname" . }}-frontend
  labels:
    {{- $ctx := dict "component" "frontend" "Values" .Values "Chart" .Chart "Release" .Release }}
    {{- include "helixguard.componentLabels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
  selector:
    {{- $ctx := dict "component" "frontend" "Values" .Values "Chart" .Chart "Release" .Release }}
    {{- include "helixguard.componentSelectorLabels" $ctx | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helixguard.fullname" . }}-frontend
  labels:
    {{- $ctx := dict "component" "frontend" "Values" .Values "Chart" .Chart "Release" .Release }}
    {{- include "helixguard.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- $ctx := dict "component" "frontend" "Values" .Values "Chart" .Chart "Release" .Release }}
      {{- include "helixguard.componentSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      {{- with .Values.frontend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- $ctx := dict "component" "frontend" "Values" .Values "Chart" .Chart "Release" .Release }}
        {{- include "helixguard.componentSelectorLabels" $ctx | nindent 8 }}
    spec:
      serviceAccountName: {{ include "helixguard.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.ingress.publicApiUrl | default (printf "http://%s/api/v1" .Values.ingress.host) | quote }}
            - name: INTERNAL_API_URL
              value: {{ printf "http://%s-backend:8000" (include "helixguard.fullname" .) | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
