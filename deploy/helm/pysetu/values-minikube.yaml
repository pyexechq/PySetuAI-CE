# Minikube / local Kubernetes profile
ingress:
  enabled: true
  className: nginx
  host: pysetu.local
  publicApiUrl: http://pysetu.local/api/v1

backend:
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent

frontend:
  replicaCount: 1

celery:
  worker:
    replicaCount: 1

postgresql:
  persistence:
    size: 5Gi

config:
  debug: "true"
  corsOrigins: '["http://pysetu.local"]'
  frontendUrl: http://pysetu.local
  opaFailOpen: "true"
  gatewayMockMode: "true"

secrets:
  jwtSecretKey: minikube-dev-secret
