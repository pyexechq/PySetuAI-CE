apiVersion: v1
kind: Service
metadata:
  name: {{ include "pysetu.fullname" . }}-backend
  labels:
    {{- $ctx := dict "component" "backend" "Values" .Values "Chart" .Chart "Release" .Release }}
    {{- include "pysetu.componentLabels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
  selector:
    {{- $ctx := dict "component" "backend" "Values" .Values "Chart" .Chart "Release" .Release }}
    {{- include "pysetu.componentSelectorLabels" $ctx | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pysetu.fullname" . }}-backend
  labels:
    {{- $ctx := dict "component" "backend" "Values" .Values "Chart" .Chart "Release" .Release }}
    {{- include "pysetu.componentLabels" $ctx | nindent 4 }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- $ctx := dict "component" "backend" "Values" .Values "Chart" .Chart "Release" .Release }}
      {{- include "pysetu.componentSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      {{- with .Values.backend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- $ctx := dict "component" "backend" "Values" .Values "Chart" .Chart "Release" .Release }}
        {{- include "pysetu.componentSelectorLabels" $ctx | nindent 8 }}
    spec:
      serviceAccountName: {{ include "pysetu.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if .Values.postgresql.enabled }}
        - name: wait-for-postgresql
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z {{ include "pysetu.fullname" . }}-postgresql 5432; do echo waiting for postgres; sleep 2; done
        {{- end }}
        {{- if .Values.redis.enabled }}
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z {{ include "pysetu.fullname" . }}-redis 6379; do echo waiting for redis; sleep 2; done
        {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- include "pysetu.backendEnv" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
