{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pysetu.secretName" . }}
  labels:
    {{- include "pysetu.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ include "pysetu.databaseUrl" . | quote }}
  redis-url: {{ include "pysetu.redisUrl" . | quote }}
  jwt-secret-key: {{ .Values.secrets.jwtSecretKey | quote }}
  openai-api-key: {{ .Values.secrets.openaiApiKey | quote }}
  gemini-api-key: {{ .Values.secrets.geminiApiKey | quote }}
  vault-token: {{ .Values.secrets.vaultToken | quote }}
{{- end }}
