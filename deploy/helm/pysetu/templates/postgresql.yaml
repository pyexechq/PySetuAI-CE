{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pysetu.fullname" . }}-postgresql
  labels:
    {{- $ctx := dict "component" "postgresql" "Values" .Values "Chart" .Chart "Release" .Release }}
    {{- include "pysetu.componentLabels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    {{- $ctx := dict "component" "postgresql" "Values" .Values "Chart" .Chart "Release" .Release }}
    {{- include "pysetu.componentSelectorLabels" $ctx | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pysetu.fullname" . }}-postgresql
  labels:
    {{- $ctx := dict "component" "postgresql" "Values" .Values "Chart" .Chart "Release" .Release }}
    {{- include "pysetu.componentLabels" $ctx | nindent 4 }}
spec:
  serviceName: {{ include "pysetu.fullname" . }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      {{- $ctx := dict "component" "postgresql" "Values" .Values "Chart" .Chart "Release" .Release }}
      {{- include "pysetu.componentSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- $ctx := dict "component" "postgresql" "Values" .Values "Chart" .Chart "Release" .Release }}
        {{- include "pysetu.componentSelectorLabels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgresql.auth.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgresql.auth.username | quote }}
                - -d
                - {{ .Values.postgresql.auth.database | quote }}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgresql.auth.username | quote }}
                - -d
                - {{ .Values.postgresql.auth.database | quote }}
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      {{- if not .Values.postgresql.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.postgresql.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ .Values.postgresql.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
  {{- end }}
{{- end }}
