<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PySetu AI Browser Protection</title>
  <style>
    body { width: 360px; margin: 0; padding: 20px; color: #172033; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    h1 { margin: 0 0 18px; font-size: 18px; }
    label { display: block; margin: 12px 0 5px; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: 9px; border: 1px solid #aab3c2; border-radius: 6px; }
    button { margin-top: 16px; padding: 9px 14px; border: 0; border-radius: 6px; background: #175cd3; color: white; cursor: pointer; }
    #status { margin-top: 14px; min-height: 20px; }
  </style>
</head>
<body>
  <h1>PySetu AI Browser Protection</h1>
  <label for="backend-url">Backend URL</label>
  <input id="backend-url" type="url" placeholder="http://localhost:8001">
  <label for="api-key">Extension API key</label>
  <input id="api-key" type="password" autocomplete="off" placeholder="hg_...">
  <button id="save" type="button">Save and verify</button>
  <div id="status" role="status"></div>
  <script src="options.js"></script>
</body>
</html>
