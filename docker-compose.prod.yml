services:
  postgres:
    image: postgres:16-alpine
    container_name: pysetu_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pysetu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pysetu}
      POSTGRES_DB: ${POSTGRES_DB:-pysetu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pysetu} -d ${POSTGRES_DB:-pysetu}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pysetu_redis
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.17
    container_name: pysetu_vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-pysetu-vault-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev -dev-root-token-id=${VAULT_TOKEN:-pysetu-vault-root-token}
    volumes:
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  opa:
    image: openpolicyagent/opa:0.68.0
    container_name: pysetu_opa
    command:
      - "run"
      - "--server"
      - "--log-level=info"
      - "/policies/gateway.rego"
    volumes:
      - ./deploy/opa/policies:/policies:ro
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pysetu_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pysetu}:${POSTGRES_PASSWORD:-pysetu}@postgres:5432/${POSTGRES_DB:-pysetu}
      REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-pysetu-super-secret-jwt-key-for-auth-change-in-production}
      DEBUG: "false"
      CORS_ORIGINS: '["https://pysetu.io","https://www.pysetu.io","https://app.pysetu.io","https://acme.pysetu.io","http://localhost:3000"]'
      FRONTEND_URL: ${FRONTEND_URL:-https://app.pysetu.io}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_DEFAULT_MODEL: ${GEMINI_DEFAULT_MODEL:-gemini-1.5-pro}
      OLLAMA_ENABLED: "false"
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@pysetu.io}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      VAULT_ENABLED: "true"
      VAULT_ADDR: http://vault:8200
      VAULT_AUTH_METHOD: token
      VAULT_TOKEN: ${VAULT_TOKEN:-pysetu-vault-root-token}
      VAULT_MOUNT_PATH: secret
      LLM_REBALANCE_SCHEDULE_ENABLED: "true"
      LLM_REBALANCE_CRON_HOUR: "2"
      LLM_REBALANCE_CRON_MINUTE: "0"
      OPA_ENABLED: "true"
      OPA_BASE_URL: http://opa:8181
      OPA_FAIL_OPEN: "false"
      OIDC_ENABLED: "true"
      OIDC_JIT_PROVISION_DEFAULT: "false"
      DEPLOYMENT_MODE: saas
      PLATFORM_PORTAL_ENABLED: "true"
      PLATFORM_TENANT_SLUG: platform
      APP_BASE_DOMAIN: ${APP_BASE_DOMAIN:-pysetu.io}
      APP_BASE_SCHEME: https
      IAC_DEPLOY_ROOT: /deploy
      DEMO_CREDENTIALS_ENABLED: ${DEMO_CREDENTIALS_ENABLED:-true}
      DEMO_SEED_PASSWORD: ${DEMO_SEED_PASSWORD:-demo1234}
      DEMO_PLATFORM_ADMIN_PASSWORD: ${DEMO_PLATFORM_ADMIN_PASSWORD:-Admin@PySetu2026!}
    volumes:
      - ./deploy:/deploy:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pysetu-api.entrypoints=websecure"
      - "traefik.http.routers.pysetu-api.rule=(Host(`pysetu.io`) || Host(`www.pysetu.io`) || Host(`app.pysetu.io`) || Host(`api.pysetu.io`) || Host(`acme.pysetu.io`) || Host(`demo.pysetu.io`) || HostRegexp(`^[a-z0-9-]+\\.pysetu\\.io$$`)) && (PathPrefix(`/api/`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`) || PathPrefix(`/health`))"
      - "traefik.http.routers.pysetu-api.priority=10"
      - "traefik.http.routers.pysetu-api.tls=true"
      - "traefik.http.routers.pysetu-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.pysetu-api.loadbalancer.server.port=8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      vault:
        condition: service_healthy
      opa:
        condition: service_started
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pysetu_celery_worker
    command: celery -A app.worker.celery_app worker --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME -t 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pysetu}:${POSTGRES_PASSWORD:-pysetu}@postgres:5432/${POSTGRES_DB:-pysetu}
      REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-pysetu-super-secret-jwt-key-for-auth-change-in-production}
      DEBUG: "false"
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@pysetu.io}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      LLM_REBALANCE_SCHEDULE_ENABLED: "true"
      LLM_REBALANCE_CRON_HOUR: "2"
      LLM_REBALANCE_CRON_MINUTE: "0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pysetu_celery_beat
    command: celery -A app.worker.celery_app beat --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "test -f /proc/1/cmdline && grep -q beat /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pysetu}:${POSTGRES_PASSWORD:-pysetu}@postgres:5432/${POSTGRES_DB:-pysetu}
      REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-pysetu-super-secret-jwt-key-for-auth-change-in-production}
      DEBUG: "false"
      LLM_REBALANCE_SCHEDULE_ENABLED: "true"
      LLM_REBALANCE_CRON_HOUR: "2"
      LLM_REBALANCE_CRON_MINUTE: "0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      celery-worker:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_DEMO_LOGIN_HINTS: "false"
        NEXT_PUBLIC_DEMO_LOGIN_EMAIL: ""
        NEXT_PUBLIC_DEMO_LOGIN_PASSWORD: ""
        NEXT_PUBLIC_DEMO_LOGIN_TENANT: "platform"
    container_name: pysetu_frontend
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      INTERNAL_API_URL: http://backend:8000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pysetu-frontend.entrypoints=websecure"
      - "traefik.http.routers.pysetu-frontend.rule=Host(`pysetu.io`) || Host(`www.pysetu.io`) || Host(`app.pysetu.io`) || Host(`acme.pysetu.io`) || Host(`demo.pysetu.io`) || HostRegexp(`^[a-z0-9-]+\\.pysetu\\.io$$`)"
      - "traefik.http.routers.pysetu-frontend.priority=1"
      - "traefik.http.routers.pysetu-frontend.tls=true"
      - "traefik.http.routers.pysetu-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pysetu-frontend.tls.domains[0].main=pysetu.io"
      - "traefik.http.routers.pysetu-frontend.tls.domains[0].sans=www.pysetu.io,app.pysetu.io,api.pysetu.io,acme.pysetu.io,demo.pysetu.io,globex.pysetu.io,trial.pysetu.io,sandbox.pysetu.io,preview.pysetu.io"
      - "traefik.http.services.pysetu-frontend.loadbalancer.server.port=3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
